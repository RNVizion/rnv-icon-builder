[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnv-icon-builder"
version = "3.0.0"
description = "Professional multi-resolution ICO file builder with theme support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "RNV"},
]
keywords = ["icon", "ico", "favicon", "pyqt6", "image-processing", "desktop-app"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Build Tools",
    "Framework :: Qt",
]
dependencies = [
    "PyQt6>=6.6.0,<7.0",
    "Pillow>=10.0.0,<13.0",
]

[project.urls]
Homepage = "https://github.com/RNVizion/rnv-icon-builder"
Repository = "https://github.com/RNVizion/rnv-icon-builder"
Issues = "https://github.com/RNVizion/rnv-icon-builder/issues"

[project.scripts]
rnv-icon-builder = "RNV_Icon_Builder:main"
rnv-icon-cli = "cli:main"

# The two entry points above live in root modules, not in a package, so
# they are named here; without them the installed commands cannot import.
[tool.setuptools]
py-modules = ["RNV_Icon_Builder", "cli"]

[tool.setuptools.packages.find]
include = ["core*", "ui*", "utils*", "resources*"]

# resources/ and its folders are found as packages (namespace packages: they
# have no __init__.py), so their files install beside core/, ui/ and utils/,
# where utils/config.py looks for them (BASE_DIR is the parent of utils/).
# Package data is matched inside each package: the old "resources/**/*"
# pattern under "*" matched nothing. tests/test_install_resources.py holds this.
[tool.setuptools.package-data]
"*" = ["py.typed"]
resources = ["**/*"]

# ── Dependency coherence (RNV-DEPENDENCY-COHERENCE, 2026-09-07) ────
# The declarations in this file and in requirements.txt had drifted
# apart, so which range applied depended on which file you installed
# from. tests/test_dependency_coherence.py fails if they disagree
# again, if an exact `==` pin comes back, or if Pillow stops matching
# the range all five applications share.

# RNV Icon Builder — setup.cfg
# Currently used only for mutmut configuration (mutmut 3).
# pytest and coverage read their own dedicated configs (pytest.ini, .coveragerc).
#
#     python -m mutmut run
#
# mutmut copies the code into mutants/ (git ignores it) and runs pytest there.

[mutmut]
# The module to mutate — change it to audit a different module.
source_paths = ui/image_adjustments.py

# What the tests import besides the mutated module. mutmut copies tests/,
# setup.cfg, pyproject.toml and the root test*.py by itself.
also_copy =
    core
    utils
    ui
    pytest.ini
    brand_map.json

# The tests run against each mutant: the unittest class for this module.
# Running the full suite per mutant would take many hours.
pytest_add_cli_args_test_selection =
    test_rnv_icon_builder.py::TestImageAdjustments
